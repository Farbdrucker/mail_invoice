[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-invoice"
version = "0.1.0"
description = "Fetch and archive invoice emails from IMAP with SQLite tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
]

[project.scripts]
mail-invoice = "mail_invoice.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["mail_invoice"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RUF",
    "ANN",
    "RET",
    "EM",
    "TRY",
]
ignore = [
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"mail_invoice/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mail_invoice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
